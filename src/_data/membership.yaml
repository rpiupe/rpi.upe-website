requirements:
  - You are pursuing a degree in a computing or information discipline.
  - Undergraduates rank in the top 35% of their class, have a GPA of at least 3.0, and have completed at least 45 credit hours, including 15 in computing courses.
  - Graduate students rank in the top 35% of their class, have a GPA of at least 3.5, have spent at least one semester in graduate study here, and have completed half the credits a master's degree requires.
  - The chapter may set higher standards. The chapter constitution has the details.
